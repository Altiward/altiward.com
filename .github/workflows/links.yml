name: Links

# Pushes and pull requests check links within the site, so another site being down never
# fails them. The weekly run, and a manual run, also check links to other sites.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # The Azure portal refuses automated requests; its Deploy to Azure links are fine.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            --index-files index.html
            --include-fragments
            --exclude '^https://portal\.azure\.com/'
            --max-retries 3
            --timeout 30
            ${{ github.event_name != 'push' && github.event_name != 'pull_request' && ' ' || '--offline' }}
            .
          fail: true
